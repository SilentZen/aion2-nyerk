<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Tasks</title>
    <link rel="stylesheet" href="/_nyerk/nyerk.css" />
    <link rel="stylesheet" href="tab.css" />
    <script src="/_nyerk/nyerk.js"></script>
    <script src="logic.js" defer></script>
    <script src="tasks.js" defer></script>
    <script src="season.js" defer></script>
    <script src="tab.js" defer></script>
  </head>
  <body>
    <div class="page">
      <div class="bar">
        <div id="tabs" class="tabs" role="tablist" aria-label="Task lists"></div>
        <button id="member" type="button" class="n-pill" aria-pressed="false">Sub?</button>
        <div id="chars" class="chars"></div>
      </div>
      <p id="reset" class="n-hint reset"></p>
      <p id="waiting" class="n-card empty n-hint" hidden></p>
      <div id="groups" class="groups"></div>
      <p class="note n-muted">
        Counts marked "from the game" are read from it as you play; the rest are ticked by hand, and
        stocks add their refills on their own once you enter what you have. Limits marked Server are
        shared by every character on that server.
      </p>
    </div>
  </body>
</html>
